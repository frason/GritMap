name: Karoo beta release

on:
  push:
    tags:
      - "karoo-beta-*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android native toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Validate tag and version
        id: version
        working-directory: apps/karoo
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n 's/.*gritmapVersionName").orNull ?: "\([0-9][0-9.]*\)".*/\1/p' app/build.gradle.kts)"
          VERSION_CODE="$(sed -n 's/.*gritmapVersionCode").orNull?.toInt() ?: \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts)"
          EXPECTED_TAG="karoo-beta-${VERSION_NAME}"
          test "$GITHUB_REF_NAME" = "$EXPECTED_TAG" || {
            echo "Tag $GITHUB_REF_NAME does not match $EXPECTED_TAG" >&2
            exit 1
          }
          echo "name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

      - name: Restore beta signing identity
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KAROO_BETA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KAROO_BETA_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KAROO_BETA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KAROO_BETA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          SIGNING_DIR="$RUNNER_TEMP/gritmap-signing"
          mkdir -p "$SIGNING_DIR"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$SIGNING_DIR/gritmap-beta.jks"
          {
            echo "storeFile=$SIGNING_DIR/gritmap-beta.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$SIGNING_DIR/beta-signing.properties"
          echo "properties=$SIGNING_DIR/beta-signing.properties" >> "$GITHUB_OUTPUT"

      - name: Test, lint, and build signed beta
        working-directory: apps/karoo
        run: |
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleBeta \
            -PgritmapBetaSigningProperties='${{ steps.signing.outputs.properties }}' \
            -PgritmapVersionCode='${{ steps.version.outputs.code }}' \
            -PgritmapVersionName='${{ steps.version.outputs.name }}-beta'

      - name: Verify and stage release assets
        working-directory: apps/karoo
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/beta/app-beta.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          BADGING="$($ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | head -1)"
          grep -F "versionCode='${{ steps.version.outputs.code }}'" <<< "$BADGING"
          grep -F "versionName='${{ steps.version.outputs.name }}-beta'" <<< "$BADGING"
          mkdir -p "$RUNNER_TEMP/gritmap-release"
          cp "$APK" "$RUNNER_TEMP/gritmap-release/gritmap-karoo.apk"
          cd "$RUNNER_TEMP/gritmap-release"
          sha256sum gritmap-karoo.apk > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: gritmap-karoo-${{ steps.version.outputs.name }}-beta
          path: |
            ${{ runner.temp }}/gritmap-release/gritmap-karoo.apk
            ${{ runner.temp }}/gritmap-release/SHA256SUMS.txt

      - name: Publish GitHub beta release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/gritmap-release/gritmap-karoo.apk" \
            "$RUNNER_TEMP/gritmap-release/SHA256SUMS.txt" \
            --title "GritMap Karoo ${{ steps.version.outputs.name }} beta" \
            --latest \
            --generate-notes
